<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Saini Engg. & Finance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
  <link rel="icon" type="image/png" href="images/favicon.png">
</head>
<body class="login-body">

  <div class="login-wrap">
    <div class="login-card">
      <!-- Brand -->
      <div class="login-brand">
        <div class="brand-mark-lg">S</div>
        <div>
          <div class="login-brand-name">Saini Engg. &amp; Finance</div>
          <div class="login-brand-sub">Admin Portal</div>
        </div>
      </div>

      <h1 class="login-title">Sign in to your dashboard</h1>
      <p class="login-desc">Enter your admin credentials to continue.</p>

      <form id="loginForm" autocomplete="off">
        <div class="field-group" id="errorBox" style="display:none;">
          <div class="error-msg" id="errorMsg">Invalid username or password.</div>
        </div>

        <div class="field-group">
          <label class="field-label" for="username">Username</label>
          <input class="field-input" type="text" id="username" placeholder="admin" autocomplete="username" required>
        </div>

        <div class="field-group">
          <label class="field-label" for="password">Password</label>
          <div class="input-pw-wrap">
            <input class="field-input" type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
            <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password">
              <svg id="eyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-login" id="loginBtn">
          <span id="loginBtnText">Sign in</span>
          <span id="loginSpinner" style="display:none;">Signing in…</span>
        </button>
      </form>

      <div class="login-footer">
        <a href="../index.html">← Back to website</a>
      </div>
    </div>

    <div class="login-decoration">
      <div class="deco-card">
        <div class="deco-icon">📋</div>
        <div class="deco-label">Manage Policies</div>
      </div>
      <div class="deco-card">
        <div class="deco-icon">🖼️</div>
        <div class="deco-label">Upload Images</div>
      </div>
      <div class="deco-card">
        <div class="deco-icon">⚙️</div>
        <div class="deco-label">Site Settings</div>
      </div>
      <p class="deco-note">All changes reflect live on the public website immediately.</p>
    </div>
  </div>

<script>
  // Redirect if already logged in
  if (sessionStorage.getItem('saini_admin_auth') === 'true') {
    window.location.href = 'dashboard.html';
  }

  const ADMIN_USER = 'admin';
  // Password set to 'admin'
  const ADMIN_PASS = 'admin';

  const form = document.getElementById('loginForm');
  const errorBox = document.getElementById('errorBox');
  const errorMsg = document.getElementById('errorMsg');
  const pwToggle = document.getElementById('pwToggle');
  const pwInput = document.getElementById('password');

  // Toggle password visibility
  pwToggle.addEventListener('click', () => {
    const show = pwInput.type === 'password';
    pwInput.type = show ? 'text' : 'password';
    pwToggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const user = document.getElementById('username').value.trim();
    const pass = document.getElementById('password').value;
    const btn = document.getElementById('loginBtn');
    const btnText = document.getElementById('loginBtnText');
    const spinner = document.getElementById('loginSpinner');

    btnText.style.display = 'none';
    spinner.style.display = 'inline';
    btn.disabled = true;

    setTimeout(() => {
      if (user === ADMIN_USER && pass === ADMIN_PASS) {
        sessionStorage.setItem('saini_admin_auth', 'true');
        window.location.href = 'dashboard.html';
      } else {
        errorBox.style.display = 'block';
        errorMsg.textContent = 'Invalid username or password. Please try again.';
        btnText.style.display = 'inline';
        spinner.style.display = 'none';
        btn.disabled = false;
        document.getElementById('password').value = '';
        document.getElementById('password').focus();
      }
    }, 700);
  });
</script>
</body>
</html>
